<svg xmlns="http://www.w3.org/2000/svg" width="440" height="510" viewBox="0 0 440 510" role="img" aria-labelledby="title desc">
  <title id="title">変更を取り消すときの判断</title>
  <desc id="desc">コミットしたか、共有したかを確認します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="510" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">変更を取り消すときの判断</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">コミットしたか、共有したかを確認します。</text>
    <rect x="20" y="88" width="400" height="112" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="117.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">未コミット</text>
    <text x="220.0" y="139.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">編集を残して対象から外す</text>
    <text x="220.0" y="161.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">git restore --staged</text>
    <text x="220.0" y="183.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">編集自体を捨てる場合は本文を参照</text>
    <rect x="20" y="212" width="400" height="90" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="241.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">コミット済み・未共有</text>
    <text x="220.0" y="263.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">変更を手元に残すか確認</text>
    <text x="220.0" y="285.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">必要に応じて git reset を検討</text>
    <rect x="20" y="314" width="400" height="90" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="343.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">コミット済み・共有済み</text>
    <text x="220.0" y="365.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">git revert で打ち消す変更を記録</text>
    <text x="220.0" y="387.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">共有履歴はそのまま</text>
    <text x="220" y="454" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">秘密情報を共有した場合は、</text>
    <text x="220" y="478" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">先にキーの失効・変更を行います。</text>
  </g>
</svg>
