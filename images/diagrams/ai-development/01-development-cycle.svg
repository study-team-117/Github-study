<svg xmlns="http://www.w3.org/2000/svg" width="440" height="605" viewBox="0 0 440 605" role="img" aria-labelledby="title desc">
  <title id="title">AI支援開発の全体像</title>
  <desc id="desc">確認で問題があれば前の工程へ戻ります。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="605" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">AI支援開発の全体像</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">確認で問題があれば前の工程へ戻ります。</text>
    <rect x="20" y="89" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="124.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">要件定義</text>
    <text x="220.0" y="146.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">人間が目的・変更範囲を決める</text>
    <path d="M 220.0 173 V 188" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="193" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="228.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">計画</text>
    <text x="220.0" y="250.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">AIが案を出し、人間が確認する</text>
    <path d="M 220.0 277 V 292" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="297" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="332.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">実装</text>
    <text x="220.0" y="354.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">作業ブランチで変更する</text>
    <path d="M 220.0 381 V 396" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="401" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="436.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">テスト・レビュー</text>
    <text x="220.0" y="458.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">差分と実行結果を確認する</text>
    <path d="M 220.0 485 V 500" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="505" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="540.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">マージ</text>
    <text x="220.0" y="562.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">人間が取り込みを判断する</text>
  </g>
</svg>
