<svg xmlns="http://www.w3.org/2000/svg" width="440" height="438" viewBox="0 0 440 438" role="img" aria-labelledby="title desc">
  <title id="title">会話をまたぐ情報共有</title>
  <desc id="desc">同じ資料を明示的に参照します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="438" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">会話をまたぐ情報共有</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">同じ資料を明示的に参照します。</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">共通資料</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">要件・設計・作業記録</text>
    <path d="M 220 172 V 205" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="210" width="400" height="65" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="248.5" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">両ツールに参照先を伝える</text>
    <path d="M 220 279 V 311" stroke="#176955" stroke-width="2" fill="none" marker-end="url(#green-arrow)"/>
    <rect x="20" y="316" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="351.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">Claude Code ／ Codex</text>
    <text x="220.0" y="373.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">指示ファイルの読み込み条件を確認</text>
    <text x="220" y="422" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">共有する資料から秘密情報を除きます。</text>
  </g>
</svg>
