<svg xmlns="http://www.w3.org/2000/svg" width="440" height="412" viewBox="0 0 440 412" role="img" aria-labelledby="title desc">
  <title id="title">worktreeによる作業分離</title>
  <desc id="desc">履歴を共有し、別のフォルダで編集します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="412" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">worktreeによる作業分離</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">履歴を共有し、別のフォルダで編集します。</text>
    <rect x="56" y="89" width="328" height="62" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="126.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">共通リポジトリ</text>
    <path d="M 220 155 V 180 H 36 V 233 H 77" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M 36 233 V 332 H 77" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="84" y="193" width="336" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="252.0" y="228.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">機能実装のフォルダ</text>
    <text x="252.0" y="250.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">feature/tasks-done</text>
    <rect x="84" y="292" width="336" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="252.0" y="327.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">文書更新のフォルダ</text>
    <text x="252.0" y="349.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">docs/tasks-help</text>
    <text x="220" y="396" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">取り込むときに競合を確認します。</text>
  </g>
</svg>
