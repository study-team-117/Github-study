<svg xmlns="http://www.w3.org/2000/svg" width="440" height="454" viewBox="0 0 440 454" role="img" aria-labelledby="title desc">
  <title id="title">初期設定の流れ</title>
  <desc id="desc">完了している手順は省略できます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="454" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">初期設定の流れ</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">完了している手順は省略できます。</text>
    <rect x="36" y="86" width="368" height="56" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="120.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">GitHubアカウント・2FA</text>
    <path d="M 220.0 146 V 172" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="177" width="368" height="56" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="211.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">Git・VSCodeをインストール</text>
    <path d="M 220.0 237 V 263" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="268" width="368" height="56" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="302.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">Gitに名前とメールを設定</text>
    <path d="M 220.0 328 V 354" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="359" width="368" height="56" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="393.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">認証を準備し、01章でpushを試す</text>
  </g>
</svg>
