<svg xmlns="http://www.w3.org/2000/svg" width="440" height="370" viewBox="0 0 440 370" role="img" aria-labelledby="title desc">
  <title id="title">DBの最小権限</title>
  <desc id="desc">サーバー型DBでのアカウントの分け方</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="370" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">DBの最小権限</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">サーバー型DBでのアカウントの分け方</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">閲覧用アカウント</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">必要な表を読む権限だけ</text>
    <rect x="20" y="180" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="215.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">アプリ用アカウント</text>
    <text x="220.0" y="237.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">必要なデータの読み書きだけ</text>
    <rect x="20" y="272" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="307.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">構造変更用アカウント</text>
    <text x="220.0" y="329.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">構造を変更するときに限定して使う</text>
  </g>
