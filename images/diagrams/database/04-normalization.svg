<svg xmlns="http://www.w3.org/2000/svg" width="440" height="365" viewBox="0 0 440 365" role="img" aria-labelledby="title desc">
  <title id="title">正規化で重複を減らす</title>
  <desc id="desc">商品名は商品のIDに対応させます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="365" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">正規化で重複を減らす</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">商品名は商品のIDに対応させます。</text>
    <rect x="20" y="88" width="400" height="104" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="124.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">正規化前：同じ商品名を繰り返す</text>
    <text x="220.0" y="146.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">明細1：商品2／ペン／4個</text>
    <text x="220.0" y="168.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">明細3：商品2／ペン／2個（仮）</text>
    <path d="M 220 196 V 214" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="219" width="400" height="128" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="256.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">正規化後：商品名を一元管理</text>
    <text x="220.0" y="278.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">products：商品2／ペン</text>
    <text x="220.0" y="300.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">order_items：明細1／商品2／4個</text>
    <text x="220.0" y="322.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">order_items：明細3／商品2／2個（仮）</text>
  </g>
</svg>
