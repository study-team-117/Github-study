<svg xmlns="http://www.w3.org/2000/svg" width="440" height="400" viewBox="0 0 440 400" role="img" aria-labelledby="title desc">
  <title id="title">マイグレーションとシーダー</title>
  <desc id="desc">構造の変更と、初期データの投入を分けます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="400" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">マイグレーションとシーダー</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">構造の変更と、初期データの投入を分けます。</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">マイグレーション</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">テーブル構造を作成・変更する</text>
    <path d="M 220 172 V 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="195" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="230.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">シーダー</text>
    <text x="220.0" y="252.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">開発用のダミー商品を投入する</text>
    <path d="M 220 279 V 297" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="302" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="337.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">開発用DB</text>
    <text x="220.0" y="359.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">同じ構造と再現できるデータ</text>
  </g>
</svg>
