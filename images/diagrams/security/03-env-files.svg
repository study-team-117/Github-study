<svg xmlns="http://www.w3.org/2000/svg" width="440" height="394" viewBox="0 0 440 394" role="img" aria-labelledby="title desc">
  <title id="title">環境変数とGitの管理範囲</title>
  <desc id="desc">実際の値と、チームで共有する設定例を分けます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="394" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">環境変数とGitの管理範囲</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">実際の値と、チームで共有する設定例を分けます。</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">Gitで共有：.env.example</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">項目名とダミー値だけを書く</text>
    <rect x="20" y="180" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="216.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">Gitで共有：.gitignore</text>
    <text x="220.0" y="238.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">.envを除外対象にする</text>
    <text x="220.0" y="260.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">すでに追跡したファイルには別途対処</text>
    <rect x="20" y="296" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="331.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">手元で管理：.env</text>
    <text x="220.0" y="353.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">実際の値は必要な環境にだけ置く</text>
  </g>
</svg>
