<svg xmlns="http://www.w3.org/2000/svg" width="440" height="326" viewBox="0 0 440 326" role="img" aria-labelledby="title desc">
  <title id="title">公開範囲とアクセス権限</title>
  <desc id="desc">公開範囲は、書き込みの可否とは別です。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="326" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">公開範囲とアクセス権限</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">公開範囲は、書き込みの可否とは別です。</text>
    <rect x="20" y="88" width="400" height="104" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="124.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">Public</text>
    <text x="220.0" y="146.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">誰でも閲覧できる</text>
    <text x="220.0" y="168.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">書き込みは権限のある人だけ</text>
    <rect x="20" y="204" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="240.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">Private</text>
    <text x="220.0" y="262.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">閲覧は権限のある人や連携に限定</text>
    <text x="220.0" y="284.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">読み取りだけならReadを選ぶ</text>
  </g>
</svg>
