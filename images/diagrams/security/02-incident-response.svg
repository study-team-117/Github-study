<svg xmlns="http://www.w3.org/2000/svg" width="440" height="531" viewBox="0 0 440 531" role="img" aria-labelledby="title desc">
  <title id="title">秘密情報の漏えい時の対応</title>
  <desc id="desc">共有済み、または共有状況が不明な場合</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="531" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">秘密情報の漏えい時の対応</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">共有済み、または共有状況が不明な場合</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#9b3440" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#9b3440" text-anchor="middle">最優先：失効・変更</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">発行元で有効な値を止める</text>
    <path d="M 220 172 V 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="195" width="400" height="104" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="231.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">連絡と必要な切り替え</text>
    <text x="220.0" y="253.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">管理者には値を送らない</text>
    <text x="220.0" y="275.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">必要なら新しい値を発行・適用</text>
    <path d="M 220 303 V 321" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="326" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="361.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">影響範囲を確認</text>
    <text x="220.0" y="383.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">権限・利用ログ・共有先を調べる</text>
    <path d="M 220 410 V 428" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="433" width="400" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="468.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">履歴整理と再発防止</text>
    <text x="220.0" y="490.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">管理者と必要な対応を判断する</text>
  </g>
</svg>
