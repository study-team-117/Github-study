<svg xmlns="http://www.w3.org/2000/svg" width="440" height="585" viewBox="0 0 440 585" role="img" aria-labelledby="title desc">
  <title id="title">Gitの4つの領域</title>
  <desc id="desc">編集した変更を記録し、GitHubに送ります。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="585" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">Gitの4つの領域</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">編集した変更を記録し、GitHubに送ります。</text>
    <rect x="20" y="87" width="290" height="76" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="165.0" y="120.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">作業フォルダ</text>
    <text x="165.0" y="142.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">編集・保存したファイル</text>
    <path d="M 165 167 V 200" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="181" y="189" font-size="18" font-weight="400" fill="#475569">git add</text>
    <rect x="20" y="205" width="290" height="76" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="165.0" y="238.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">ステージングエリア</text>
    <text x="165.0" y="260.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">次のコミットに含める内容</text>
    <path d="M 165 285 V 318" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="181" y="307" font-size="18" font-weight="400" fill="#475569">git commit</text>
    <rect x="20" y="323" width="290" height="76" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="165.0" y="356.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">ローカルリポジトリ</text>
    <text x="165.0" y="378.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">PC内のコミット履歴</text>
    <path d="M 165 403 V 436" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text x="181" y="425" font-size="18" font-weight="400" fill="#475569">git push</text>
    <rect x="20" y="441" width="290" height="76" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="165.0" y="474.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">リモートリポジトリ</text>
    <text x="165.0" y="496.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">GitHub上のコミット履歴</text>
    <path d="M 314 480 H 403 V 125 H 316" stroke="#176955" stroke-width="2" fill="none" marker-end="url(#green-arrow)"/>
    <text x="361" y="296" font-size="18" font-weight="400" fill="#176955" text-anchor="middle">git pull</text>
    <text x="219" y="548" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">pullは取得と現在のブランチへの</text>
    <text x="219" y="572" font-size="18" font-weight="400" fill="#475569" text-anchor="middle">取り込みを行います。</text>
  </g>
</svg>
