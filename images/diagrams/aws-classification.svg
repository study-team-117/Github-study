<svg xmlns="http://www.w3.org/2000/svg" width="440" height="408" viewBox="0 0 440 408" role="img" aria-labelledby="title desc">
  <title id="title">画像分類と物体検出</title>
  <desc id="desc">分類は画像全体、検出は対象の位置も扱います。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="408" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">画像分類と物体検出</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">分類は画像全体、検出は対象の位置も扱います。</text>
    <rect x="20" y="87" width="400" height="132" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="32" y="117" font-size="20" font-weight="700" fill="#245d87">画像分類</text>
    <text x="32" y="144" font-size="18" font-weight="400" fill="#172b42">画像全体 → リングあり</text>
    <rect x="33" y="157" width="114" height="47" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect x="47" y="165" width="40" height="30" rx="3" fill="#93c5fd"/>
    <rect x="51" y="163" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="59" y="163" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="67" y="163" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="75" y="163" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="107" y="169" width="9" height="24" rx="2" fill="#eabf57" stroke="#475569" stroke-width="2"/>
    <text x="163" y="187" font-size="18" font-weight="400" fill="#172b42">出力：クラス名</text>
    <rect x="20" y="238" width="400" height="132" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="32" y="268" font-size="20" font-weight="700" fill="#176955">物体検出</text>
    <text x="32" y="295" font-size="18" font-weight="400" fill="#172b42">ノート・ペンと、それぞれの位置</text>
    <rect x="33" y="308" width="114" height="47" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect x="47" y="316" width="40" height="30" rx="3" fill="#93c5fd"/>
    <rect x="51" y="314" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="59" y="314" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="67" y="314" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="75" y="314" width="3" height="6" rx="1" fill="#475569"/>
    <rect x="107" y="320" width="9" height="24" rx="2" fill="#eabf57" stroke="#475569" stroke-width="2"/>
    <rect x="43" y="311" width="48" height="39" rx="0" fill="none" stroke="#176955" stroke-width="2"/>
    <rect x="103" y="316" width="17" height="32" rx="0" fill="none" stroke="#9b3440" stroke-width="2"/>
    <text x="163" y="338" font-size="18" font-weight="400" fill="#172b42">出力：クラス名と枠</text>
  </g>
</svg>
