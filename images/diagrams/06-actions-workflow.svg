<svg xmlns="http://www.w3.org/2000/svg" width="440" height="500" viewBox="0 0 440 500" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actionsの流れ</title>
  <desc id="desc">設定したイベントに反応して実行します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="500" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">GitHub Actionsの流れ</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">設定したイベントに反応して実行します。</text>
    <rect x="36" y="87" width="368" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="122.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">イベントが発生</text>
    <text x="220.0" y="144.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">push・Pull Requestなど</text>
    <path d="M 220.0 171 V 190" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="195" width="368" height="56" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="229.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">ワークフローが起動</text>
    <path d="M 220.0 255 V 274" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="279" width="368" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="314.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">ジョブがランナーで動く</text>
    <text x="220.0" y="336.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">環境を準備し、テストを実行</text>
    <path d="M 220.0 363 V 382" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="36" y="387" width="368" height="80" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="422.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">結果を確認</text>
    <text x="220.0" y="444.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">成功・失敗とログを確認</text>
  </g>
</svg>
