<svg xmlns="http://www.w3.org/2000/svg" width="440" height="326" viewBox="0 0 440 326" role="img" aria-labelledby="title desc">
  <title id="title">学習と推論の違い</title>
  <desc id="desc">モデルの内部パラメータを更新するかで区別。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="326" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">学習と推論の違い</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">モデルの内部パラメータを更新するかで区別。</text>
    <rect x="20" y="88" width="400" height="104" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="124.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">学習</text>
    <text x="220.0" y="146.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">学習データから予測し、誤差を調べる</text>
    <text x="220.0" y="168.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">パラメータを更新する</text>
    <rect x="20" y="204" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="240.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">推論</text>
    <text x="220.0" y="262.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">学習済みモデルで入力から出力を生成</text>
    <text x="220.0" y="284.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">通常はパラメータを更新しない</text>
  </g>
</svg>
