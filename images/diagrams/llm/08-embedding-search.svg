<svg xmlns="http://www.w3.org/2000/svg" width="440" height="426" viewBox="0 0 440 426" role="img" aria-labelledby="title desc">
  <title id="title">Embeddingと類似度検索</title>
  <desc id="desc">意味の近さを数値で近似します。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="426" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">Embeddingと類似度検索</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">意味の近さを数値で近似します。</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">教材の抜粋を数値ベクトルへ</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">例：コミット対象から変更を外す</text>
    <path d="M 220 172 V 191" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="196" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="231.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">質問も同じモデルで変換</text>
    <text x="220.0" y="253.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">例：選んだファイルを対象から外したい</text>
    <path d="M 220 280 V 299" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="304" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="340.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">近い教材の抜粋を取得</text>
    <text x="220.0" y="362.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">ベクトル同士の類似度で比較</text>
    <text x="220.0" y="384.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">取得した本文が根拠になるか確認</text>
  </g>
</svg>
