<svg xmlns="http://www.w3.org/2000/svg" width="440" height="450" viewBox="0 0 440 450" role="img" aria-labelledby="title desc">
  <title id="title">RAGの処理フロー</title>
  <desc id="desc">検索の準備と質問時の処理を分けます。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="450" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">RAGの処理フロー</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">検索の準備と質問時の処理を分けます。</text>
    <rect x="20" y="88" width="400" height="104" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="124.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">事前：教材を整理</text>
    <text x="220.0" y="146.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">見出しなどで分割して検索できる形へ</text>
    <text x="220.0" y="168.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">ベクトル検索ならEmbeddingを作る</text>
    <path d="M 220 196 V 215" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="220" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="255.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">質問時：関連する節を検索</text>
    <text x="220.0" y="277.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">結果には本文・見出し・リンクを残す</text>
    <path d="M 220 304 V 323" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="328" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="364.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">質問時：回答と出典を表示</text>
    <text x="220.0" y="386.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">質問と資料をLLMへ渡す</text>
    <text x="220.0" y="408.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">アプリが回答と出典の対応を確認</text>
  </g>
</svg>
