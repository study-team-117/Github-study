<svg xmlns="http://www.w3.org/2000/svg" width="440" height="426" viewBox="0 0 440 426" role="img" aria-labelledby="title desc">
  <title id="title">MCPと外部機能の接続</title>
  <desc id="desc">アプリと接続先の間で使う共通の手順です。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176955"/>
    </marker>
  </defs>
  <g font-family="Noto Sans CJK JP, Hiragino Sans, Yu Gothic, Meiryo, sans-serif">
    <rect x="0" y="0" width="440" height="426" rx="16" fill="#f8fafc"/>
    <text x="20" y="37" font-size="24" font-weight="700" fill="#172b42">MCPと外部機能の接続</text>
    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">アプリと接続先の間で使う共通の手順です。</text>
    <rect x="20" y="88" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="123.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">ホスト：AIアプリ</text>
    <text x="220.0" y="145.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">利用者とのやり取りや権限確認を管理</text>
    <path d="M 220 172 V 191" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="196" width="400" height="80" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="220.0" y="231.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">MCPクライアント</text>
    <text x="220.0" y="253.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">ホスト側でサーバーごとの接続を扱う</text>
    <path d="M 220 280 V 299" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="20" y="304" width="400" height="104" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="220.0" y="340.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">MCPサーバー</text>
    <text x="220.0" y="362.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">例：教材検索ツールや資料を提供</text>
    <text x="220.0" y="384.0" font-size="18" font-weight="400" fill="#172b42" text-anchor="middle">利用許可を確認して接続する</text>
  </g>
</svg>
