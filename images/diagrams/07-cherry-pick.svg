    <rect x="186" y="131" width="52" height="44" rx="10" fill="#ffffff" stroke="#176955" stroke-width="2"/>
    <text x="212.0" y="159.0" font-size="20" font-weight="700" fill="#176955" text-anchor="middle">D</text>
