    <text x="50.0" y="343.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">A</text>
    <path d="M 80 337 H 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
