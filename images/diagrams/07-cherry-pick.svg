    <text x="20" y="65" font-size="18" font-weight="400" fill="#475569">Dの変更を取り込み先に適用します。</text>
    <text x="20" y="89" font-size="18" font-weight="400" fill="#475569">この例では新しいコミットD′になります。</text>
    <text x="24" y="119" font-size="19" font-weight="700" fill="#172b42">取り込み元 feature/login</text>
