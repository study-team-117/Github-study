    <rect x="267" y="131" width="52" height="44" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="293.0" y="159.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">E</text>
    <text x="24" y="211" font-size="19" font-weight="700" fill="#172b42">取り込み先 feature/report（前）</text>
    <rect x="24" y="223" width="52" height="44" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="50.0" y="251.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">A</text>
    <path d="M 80 245 H 100" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="105" y="223" width="52" height="44" rx="10" fill="#ffffff" stroke="#245d87" stroke-width="2"/>
    <text x="131.0" y="251.0" font-size="20" font-weight="700" fill="#245d87" text-anchor="middle">B</text>
